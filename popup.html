<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light">
  <title>网申投递助手</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="popup-header">
    <div class="brand-mark" aria-hidden="true">网申</div>
    <div class="brand-text">
      <div class="brand-title">网申投递助手</div>
      <div class="brand-subtitle">求职提效一体化系统 v1.0</div>
    </div>
  </header>

  <section class="popup-stats">
    <div class="mini-stat">
      <span class="mini-stat-num" id="popupTotal">0</span>
      <span class="mini-stat-label">总投递</span>
    </div>
    <div class="mini-stat">
      <span class="mini-stat-num" id="popupToday">0</span>
      <span class="mini-stat-label">今日投递</span>
    </div>
    <div class="mini-stat">
      <span class="mini-stat-num" id="popupActive">0</span>
      <span class="mini-stat-label">进行中</span>
    </div>
    <div class="mini-stat">
      <span class="mini-stat-num mini-stat-offer" id="popupOffer">0</span>
      <span class="mini-stat-label">Offer</span>
    </div>
  </section>

  <nav class="popup-nav">
    <button class="popup-nav-item is-primary" data-target="">
      <span class="nav-icon" aria-hidden="true">01</span>
      <span class="nav-label">投递追踪看板</span>
      <span class="nav-arrow">→</span>
    </button>
    <button class="popup-nav-item" data-target="#resume">
      <span class="nav-icon" aria-hidden="true">02</span>
      <span class="nav-label">我的简历资料库</span>
      <span class="nav-arrow">→</span>
    </button>
    <button class="popup-nav-item" data-target="#safety">
      <span class="nav-icon" aria-hidden="true">03</span>
      <span class="nav-label">数据安全与备份</span>
      <span class="nav-arrow">→</span>
    </button>
  </nav>

  <section class="popup-setting">
    <div class="setting-text">
      <div class="setting-title">网页悬浮助手</div>
      <div class="setting-desc">在网页右侧显示“投递助手”胶囊入口</div>
    </div>
    <label class="switch" title="切换悬浮胶囊显示">
      <input type="checkbox" id="capsuleToggle" checked aria-label="显示网页悬浮助手">
      <span class="slider"></span>
    </label>
  </section>

  <section class="popup-setting">
    <div class="setting-text">
      <div class="setting-title">胶囊自由拖拽</div>
      <div class="setting-desc">悬浮胶囊可拖到任意位置，弹窗按住顶栏也可拖动</div>
    </div>
    <label class="switch" title="切换自由拖拽">
      <input type="checkbox" id="freeDragToggle" aria-label="启用胶囊自由拖拽">
      <span class="slider"></span>
    </label>
  </section>

  <footer class="popup-footer">
    <strong>快捷提示</strong>
    <p>在任意招聘网站按 <code>Ctrl+Shift+F</code> 可唤起侧边栏辅助填报与一键收录。</p>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
